name: do-better

services:
  postgres:
    image: postgres:18
    container_name: do-better-postgres
    environment:
      POSTGRES_DB: do-better
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - do-better_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  do-better_postgres_data:
